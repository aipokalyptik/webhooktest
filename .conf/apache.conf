# Copy into Apache's virtual-host configuration; adjust hostname and paths.
# Enable PHP-FPM or mod_php using your host's normal PHP setup, and add HTTPS.
<VirtualHost *:80>
    ServerName hooks.example.com
    DocumentRoot /var/www/webhooktest

    <Directory /var/www/webhooktest>
        Require all granted
        # The root .htaccess handles no-cache/no-index headers, multipart on mod_php,
        # and one directory-wide rule blocking .conf and all other dot paths.
        AllowOverride All
    </Directory>
</VirtualHost>

# Copy into nginx's sites configuration; adjust hostname, root, and PHP-FPM socket.
# The repository root is the document root. Add your normal HTTPS configuration.
server {
    listen 80;
    server_name hooks.example.com;
    root /var/www/webhooktest;
    index index.php;
    client_max_body_size 10m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    # Match before the PHP handler: protect .conf, .git, and other dot paths together.
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

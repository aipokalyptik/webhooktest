name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: HTTP and storage integration
        run: timeout 90s python3 tests/test_service.py
      - name: Frontend helpers and replay fidelity
        run: timeout 30s node tests/test_frontend.cjs
      - name: Binary byte fidelity and search
        run: timeout 30s node tests/test_binary.cjs
      - name: File identification and multipart inspection
        run: timeout 30s php tests/test_inspection.php
      - name: Syntax languages, worker, and text fidelity
        run: timeout 30s node tests/test_syntax.cjs
